<div class="contenedor-login">
    <div class="tarjeta-login">
        <div class="header-login">
            <div class="titulo-login">
                <img class="logo" src="imgs/Vetalmy-logo.png" alt="Logo">
                <h1>VETALMY</h1>
            </div>
            <p>Crea tu cuenta veterinaria</p>
        </div>

        <form [formGroup]="registroForm" (ngSubmit)="onRegister()">

            <div class="form-group" [class.group-error]="nombreControl?.invalid && nombreControl?.touched">
                <p-floatLabel variant="on">
                    <input pInputText id="nombre" formControlName="nombre" />
                    <label for="nombre">Nombre Completo</label>
                </p-floatLabel>
                <div class="error-message"
                    [style.visibility]="nombreControl?.invalid && nombreControl?.touched ? 'visible' : 'hidden'">
                    <small>El nombre es obligatorio.</small>
                </div>
            </div>

            <div class="form-group" [class.group-error]="emailControl?.invalid && emailControl?.touched">
                <p-floatLabel variant="on">
                    <input pInputText type="email" id="email" formControlName="email" />
                    <label for="email">Correo Electrónico</label>
                </p-floatLabel>
                <div class="error-message"
                    [style.visibility]="emailControl?.invalid && emailControl?.touched ? 'visible' : 'hidden'">
                    <small *ngIf="emailControl?.errors?.['required']">El email es obligatorio.</small>
                    <small *ngIf="emailControl?.errors?.['email']">Formato de email inválido.</small>
                    <small *ngIf="!emailControl?.errors?.['required'] && !emailControl?.errors?.['email']">&nbsp;</small>
                </div>
            </div>

            <div class="form-group" [class.group-error]="passwordControl?.invalid && passwordControl?.touched">
                <p-floatLabel variant="on">
                    <p-password inputId="password" formControlName="password"
                        [feedback]="false" [toggleMask]="true" styleClass="w-full"
                        [class.input-error]="passwordControl?.invalid && passwordControl?.touched"
                        [class.input-valido]="passwordControl?.valid && passwordControl?.touched">
                    </p-password>
                    <label for="password">Contraseña</label>
                </p-floatLabel>
                <div class="error-message"
                    [style.visibility]="passwordControl?.invalid && passwordControl?.touched ? 'visible' : 'hidden'">
                    <small>Mínimo 6 caracteres.</small>
                </div>
            </div>

            <div class="form-group" [class.group-error]="registroForm.errors?.['mismatch'] && confirmControl?.touched">
                <p-floatLabel variant="on">
                    <p-password inputId="confirmPassword" formControlName="confirmPassword"
                        [feedback]="false" [toggleMask]="true" styleClass="w-full"
                        [class.input-error]="registroForm.errors?.['mismatch'] && confirmControl?.touched"
                        [class.input-valido]="!registroForm.errors?.['mismatch'] && confirmControl?.touched && confirmControl?.valid">
                    </p-password>
                    <label for="confirmPassword">Repetir Contraseña</label>
                </p-floatLabel>
                <div class="error-message"
                    [style.visibility]="registroForm.errors?.['mismatch'] && confirmControl?.touched ? 'visible' : 'hidden'">
                    <small>Las contraseñas no coinciden.</small>
                </div>
            </div>

            <div class="registro">
                <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
            </div>

            <button type="submit" [disabled]="registroForm.invalid" class="btn-principal">
                Crear cuenta
            </button>

        </form>
    </div>
</div>
