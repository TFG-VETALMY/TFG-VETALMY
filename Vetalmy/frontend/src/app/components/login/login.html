<div class="contenedor-login">
    <div class="tarjeta-login">
        <div class="header-login">
            <div class="titulo-login">
                <img class="logo" src="imgs/Vetalmy-logo.png" alt="Logo">
                <h1>VETALMY</h1>
            </div>

            <p>Gestión Veterinaria</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

            <div class="form-group">
                <p-floatLabel variant="on">
                    <input pInputText type="email" id="email" formControlName="email"
                        [class.error]="emailControl?.invalid && emailControl?.touched" />

                    <label for="email">Correo Electrónico</label>

                </p-floatLabel>

                <div class="error-message" *ngIf="emailControl?.invalid && emailControl?.touched">
                    <small *ngIf="emailControl?.errors?.['required']">El email es obligatorio.</small>
                    <small *ngIf="emailControl?.errors?.['email']">Introduce un formato de email válido.</small>
                </div>
            </div>

            <div class="form-group">
                <p-floatLabel variant="on">
                    <input pInputText type="password" id="password" formControlName="password"
                        [class.error]="passwordControl?.invalid && passwordControl?.touched">
                    <label for="password">Contraseña</label>
                </p-floatLabel>

                <div class="error-message" *ngIf="passwordControl?.invalid && passwordControl?.touched">
                    <small *ngIf="passwordControl?.errors?.['required']">La contraseña es obligatoria.</small>
                    <small *ngIf="passwordControl?.errors?.['minlength']">Mínimo 6 caracteres.</small>
                </div>
            </div>

            <div class="registro">
                <p>¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></p>
            </div>

            <button type="submit" [disabled]="loginForm.invalid" class="btn-principal">
                Entrar a la clínica
            </button>

            <div class="separador-oauth">
                <span>o continúa con</span>
            </div>

            <a class="btn-google" (click)="loginConGoogle()">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20" height="20">
                    <path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 2.9l5.7-5.7C34.4 6.5 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.9z"/>
                    <path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 16 19 13 24 13c3.1 0 5.8 1.1 8 2.9l5.7-5.7C34.4 6.5 29.5 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                    <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.3 35.3 26.8 36 24 36c-5.2 0-9.6-3.3-11.3-8H6.3C9.7 39.7 16.3 44 24 44z"/>
                    <path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l.1-.1 6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.7-.4-3.9z"/>
                </svg>
                Continuar con Google
            </a>

        </form>
    </div>
</div>
